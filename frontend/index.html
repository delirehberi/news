<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Curated News</title>
  </head>
  <body class="antialiased selection:bg-amber-500/20 selection:text-amber-200">
    <div id="header-container"></div>
    
    <header class="max-w-3xl mx-auto px-4 pt-8 pb-6">
      <div class="flex flex-col sm:flex-row sm:items-baseline sm:justify-between gap-2 border-b border-[var(--color-border-subtle)] pb-4">
        <p id="app-subtitle" class="text-[var(--color-ink-muted)] text-base font-normal tracking-normal">
          %VITE_APP_SUBTITLE%
        </p>
      </div>
      <div class="flex items-center justify-between mt-4">
        <div class="flex items-center gap-2">
          <button id="tab-hot" class="px-3 py-1 text-xs font-medium rounded-full bg-[var(--color-surface-elevated)] border border-[var(--color-border-subtle)] text-[var(--color-ink)] transition-colors flex items-center gap-1 shadow-xs cursor-pointer">
            <span>🔥</span>
            <span>Top Stories</span>
          </button>
          <button id="tab-latest" class="px-3 py-1 text-xs font-medium rounded-full text-[var(--color-ink-muted)] hover:text-[var(--color-ink)] transition-colors flex items-center gap-1 cursor-pointer">
            <span>⏱️</span>
            <span>Latest</span>
          </button>
        </div>
        <span id="curated-status" class="text-xs font-mono text-[var(--color-ink-faint)] tracking-tight hidden"></span>
      </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 pb-24">
      <div id="loading" class="flex flex-col gap-2" aria-label="Loading curated articles" aria-busy="true">
        <div class="skeleton-card space-y-2">
          <div class="skeleton-bar h-4 w-1/4"></div>
          <div class="skeleton-bar h-5 w-4/5"></div>
        </div>
        <div class="skeleton-card space-y-2">
          <div class="skeleton-bar h-4 w-1/3"></div>
          <div class="skeleton-bar h-5 w-3/4"></div>
        </div>
      </div>

      <div id="error" class="hidden text-center text-rose-300 bg-rose-950/30 p-6 rounded-xl border border-rose-800/40 text-sm"></div>
      
      <div id="feed" class="hidden flex flex-col gap-2">
        <!-- Articles dynamically injected here -->
      </div>
    </main>

    <div id="footer-container"></div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
